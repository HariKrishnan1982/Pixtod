<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Image Viewer Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>📸 Image Downloader</h1>
    
    <div class="section">
      <label>Download Type:</label>
      <select id="downloadType">
        <option value="single">Single Image</option>
        <option value="batch">Batch Download</option>
        <option value="smart">Smart Selection</option>
      </select>
    </div>

    <div class="section">
      <label>Quality:</label>
      <select id="quality">
        <option value="original">Original</option>
        <option value="high">High (1920px)</option>
        <option value="medium">Medium (1280px)</option>
        <option value="custom">Custom Resolution</option>
      </select>
    </div>

    <div class="section" id="customResSection" style="display:none;">
      <label>Width:</label>
      <input type="number" id="customWidth" placeholder="1920">
      <label>Height:</label>
      <input type="number" id="customHeight" placeholder="1080">
    </div>

    <div class="section">
      <label>Format:</label>
      <select id="format">
        <option value="original">Keep Original</option>
        <option value="jpg">Convert to JPG</option>
        <option value="png">Convert to PNG</option>
        <option value="webp">Convert to WebP</option>
      </select>
    </div>

    <div class="section">
      <label>
        <input type="checkbox" id="autoRename"> Auto-rename files
      </label>
    </div>

    <div class="section">
      <label>
        <input type="checkbox" id="organizeFolders"> Organize by folder
      </label>
    </div>

    <button id="saveSettings">💾 Save Settings</button>
    <div id="message"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
