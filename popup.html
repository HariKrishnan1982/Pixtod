<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Image Viewer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon48.png" alt="" class="logo" />
      <span>Image Viewer</span>
    </div>
    <span class="version">v1.1.0</span>
  </header>

  <main>
    <div class="row">
      <div class="row-text">
        <strong>Dark theme</strong>
        <small>Switch the popup's own appearance</small>
      </div>
      <button type="button" class="switch" id="darkTheme" role="switch" aria-checked="false">
        <span class="switch-thumb"></span>
      </button>
    </div>

    <div class="row">
      <div class="row-text">
        <strong>Dimensions &amp; size</strong>
        <small>Show resolution and file size on hover</small>
      </div>
      <button type="button" class="switch" id="showDimensions" role="switch" aria-checked="false">
        <span class="switch-thumb"></span>
      </button>
    </div>

    <div class="divider"></div>

    <div class="shortcuts-line">
      <span><kbd>V</kbd> View</span>
      <span><kbd>S</kbd> Save</span>
      <span><kbd>C</kbd> Copy</span>
    </div>
    <p class="hint">Hover an image, then press a key. Batch-select from the toggle in a page's bottom-right corner.</p>
  </main>

  <footer>
    <a href="https://github.com/HariKrishnan1982/View_Photo" target="_blank" rel="noopener noreferrer">
      Found a bug or have a request? <span class="link-em">Open an issue</span>
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
