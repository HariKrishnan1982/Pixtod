<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Same brand palette as before: paper bg #17140F, ink fg #EDE8DC, mark accent #D9694F -->

  <!-- Background: the darkroom "paper" surface -->
  <rect x="4" y="4" width="120" height="120" rx="22" fill="#17140F"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="21.5" fill="none" stroke="#EDE8DC" stroke-opacity="0.10" stroke-width="1"/>

  <!-- The frame: a plain photo/viewfinder square, dead center -->
  <rect x="32" y="32" width="64" height="64" rx="4" fill="none" stroke="#EDE8DC" stroke-width="5"/>

  <!-- Corner mount: an L-bracket pinned to the top-right corner, same accent
       used for the "save" mark elsewhere in the brand -->
  <path d="M96 32 L96 52 M96 32 L76 32" fill="none" stroke="#D9694F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Overlay dot: the button that would sit in that corner on a real page -->
  <circle cx="48" cy="80" r="6" fill="#D9694F"/>
</svg>
